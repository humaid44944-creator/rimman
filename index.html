<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوتيك الريمان</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2f6;--card:#fff;--ink:#2b1b34;--mute:#6f6378;--line:#ddd3e3;--accent:#a8873e;--gold:#7d6224;--wa:#1c8f50;--serif:Amiri,"Noto Naskh Arabic",serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1020;--card:#241830;--ink:#f1ebf4;--mute:#b3a6bd;--line:#3a2b46;--accent:#c9a85c;--gold:#d4b46a}}
:root[data-theme="dark"]{--bg:#1a1020;--card:#241830;--ink:#f1ebf4;--mute:#b3a6bd;--line:#3a2b46;--accent:#c9a85c;--gold:#d4b46a}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:70px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;line-height:1.7}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.logo{font-family:var(--serif);font-size:1.8rem;font-weight:700;line-height:1.2}
.cartbtn{border:1px solid var(--ink);padding:6px 16px;border-radius:2px;font-weight:700}
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;max-width:1000px;margin:auto;padding:44px 18px 30px}
.hero h1{font-family:var(--serif);font-size:clamp(2.5rem,9vw,4.6rem);font-weight:700;line-height:1.2}
.hero p{margin-top:12px;color:var(--mute);max-width:44ch;font-size:1.08rem}
.cta{display:inline-block;margin-top:20px;padding:11px 30px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;border-radius:2px}
.archart{width:clamp(100px,26vw,220px);aspect-ratio:3/4;border:1.5px solid var(--accent);border-radius:999px 999px 0 0;padding:8px}
.archart::after{content:"";display:block;width:100%;height:100%;border-radius:999px 999px 0 0;background:linear-gradient(160deg,#7a5690,#2b1b34 72%)}
.tabs{display:flex;gap:20px;padding:10px 18px 0;max-width:1000px;margin:auto;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{padding:6px 2px;border-bottom:2px solid transparent;color:var(--mute);font-weight:500;white-space:nowrap}
.tab[aria-pressed=true]{color:var(--ink);border-color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:32px 18px;padding:26px 18px;max-width:1000px;margin:auto}
.tile{aspect-ratio:3/4;border-radius:999px 999px 6px 6px;display:grid;place-items:center;font-size:4.4rem;overflow:hidden;transition:background .35s;box-shadow:inset 0 -50px 60px rgba(43,27,52,.16)}
.tile img{width:100%;height:100%;object-fit:cover}
.info{padding-top:12px}
.name{font-family:var(--serif);font-size:1.3rem;font-weight:700;line-height:1.3}
.price{color:var(--gold);font-weight:700;margin-bottom:8px}
.row{display:flex;gap:7px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--accent)}
.sz{min-width:34px;padding:1px 8px;border:1px solid var(--line);border-radius:2px;font-size:.85rem}
.sz[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.add{width:100%;background:var(--ink);color:var(--bg);font-weight:700;padding:9px;border-radius:2px;margin-top:4px;transition:background .2s}
.add:hover{background:var(--accent)}
#drawer{position:fixed;inset:0;background:rgba(26,16,32,.6);display:none;z-index:20}
#drawer.open{display:block}
.sheet{position:absolute;bottom:0;left:0;right:0;max-height:85%;overflow:auto;background:var(--card);border-top:2px solid var(--accent);padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto}
.sheet h2{font-family:var(--serif);font-size:1.6rem;margin-bottom:10px}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item small{color:var(--mute);display:block}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border:1px solid var(--line);border-radius:50%}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:1.2rem;margin:16px 0}
.order{display:block;text-align:center;background:var(--wa);color:#fff;font-weight:700;padding:13px;border-radius:2px;text-decoration:none}
.empty{color:var(--mute);padding:18px 0}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--wa);display:grid;place-items:center;font-size:1.6rem;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:10}
footer{background:#2b1b34;color:#d9cfe0;text-align:center;padding:36px 18px 100px;margin-top:40px}
footer b{display:block;font-family:var(--serif);font-size:1.6rem;color:#fff;font-weight:700}
footer span{display:block}
@media (max-width:520px){.hero{grid-template-columns:1fr 96px}}
@media (prefers-reduced-motion:reduce){.tile,.add{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="logo">بوتيك الريمان</div><button class="cartbtn" id="open" aria-label="فتح السلة">السلة (<span id="cnt">0</span>)</button></header>
<section class="hero"><div><h1>أناقة هادئة،<br>تليق بك</h1><p>تشكيلة مختارة بعناية. اختر القطعة واللون والمقاس، وأرسل طلبك عبر واتساب.</p><a class="cta" href="#grid">تسوّق الآن</a></div><div class="archart" aria-hidden="true"></div></section>
<div class="tabs" id="tabs"></div>
<main class="grid" id="grid"></main>
<footer><b>بوتيك الريمان</b><span>التوصيل لجميع محافظات السلطنة</span><span>الدفع عند الاستلام</span></footer>
<a class="fab" id="fab" target="_blank" rel="noopener" aria-label="تواصل عبر واتساب">💬</a>
<div id="drawer"><div class="sheet" role="dialog" aria-label="السلة"><h2>سلتك</h2><div id="items"></div><div id="foot"></div><button id="close" style="margin-top:12px;width:100%;padding:10px;color:var(--mute)">متابعة التسوق</button></div></div>
<script>
const PHONE="96895441140", CUR="ر.ع.", STORE="بوتيك الريمان";
const DEF=[
{id:1,n:"قميص كتان",p:8.5,c:"clothes",e:"👔",cols:{"أبيض":"#e9eef2","أزرق":"#7fa6d1","رملي":"#d9c7a3"},s:["S","M","L","XL"]},
{id:2,n:"بنطلون جينز",p:12,c:"clothes",e:"👖",cols:{"نيلي":"#31476e","أسود":"#2b2f38"},s:["30","32","34","36"]},
{id:3,n:"فستان سهرة",p:25,c:"clothes",e:"👗",cols:{"أخضر":"#2f7a62","عنابي":"#8a2c47","كحلي":"#233a6b"},s:["S","M","L"]},
{id:4,n:"جاكيت شتوي",p:30,c:"clothes",e:"🧥",cols:{"زيتي":"#6b7440","أسود":"#2b2f38","رمادي":"#8d96a3"},s:["M","L","XL"]},
{id:5,n:"بلوزة قطن",p:7,c:"clothes",e:"👚",cols:{"وردي":"#e5a3b4","أبيض":"#e9eef2","أصفر":"#e8c65a"},s:["S","M","L"]},
{id:6,n:"تيشيرت كلاسيك",p:4,c:"clothes",e:"👕",cols:{"أسود":"#2b2f38","أحمر":"#c4423f","أبيض":"#e9eef2"},s:["S","M","L","XL"]},
{id:7,n:"عطر عود ملكي",p:18,c:"perfume",e:"🧴",cols:{},s:["50 مل","100 مل"]},
{id:8,n:"كريم مرطب للبشرة",p:5.5,c:"health",e:"🧼",cols:{},s:[]},
{id:9,n:"أحمر شفاه مطفي",p:6,c:"makeup",e:"💄",cols:{"وردي":"#d98aa0","أحمر":"#b02a3c","نيود":"#c99a86"},s:[]},
{id:10,n:"حقيبة جلد طبيعي",p:35,c:"bags",e:"👜",cols:{"أسود":"#2b2f38","بني":"#7a4f35"},s:[]}];
let P=DEF;const sel={};const S=x=>sel[x.id]??={c:Object.keys(x.cols||{})[0]||"",s:(x.s||[])[0]||""};
const esc=t=>String(t).replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";");
let cart=[],cat="all";
try{cart=JSON.parse(localStorage.getItem("cart")||"[]")}catch(e){}
const $=id=>document.getElementById(id),fmt=n=>Number(n).toFixed(3)+" "+CUR;
const save=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}};
const CATS=[["clothes","الملابس"],["perfume","العطور"],["health","المواد الصحية"],["makeup","المكياج"],["bags","الحقائب والمنتجات الجلدية"]];
const cc=c=>c=="m"||c=="w"?"clothes":c;
function tabs(){$("tabs").innerHTML=[["all","الكل"],...CATS].map(([k,l])=>`<button class="tab" aria-pressed="${cat==k}" data-k="${k}">${l}</button>`).join("")}
function grid(){$("grid").innerHTML=P.filter(x=>cat=="all"||cc(x.c)==cat).map(x=>{const s=S(x),cl=Object.entries(x.cols||{}),sz=x.s||[];
return `<article class="p"><div class="tile" style="background:${cl.find(([k])=>k==s.c)?.[1]||"var(--line)"}">${x.img?`<img src="${esc(x.img)}" alt="" loading="lazy">`:esc(x.e)}</div><div class="info"><div class="name">${esc(x.n)}</div><div class="price">${fmt(x.p)}</div>
${cl.length?`<div class="row">${cl.map(([k,v])=>`<button class="sw" style="background:${v}" aria-label="${esc(k)}" aria-pressed="${s.c==k}" data-id="${esc(x.id)}" data-c="${esc(k)}"></button>`).join("")}<span style="color:var(--mute);font-size:.9rem">${esc(s.c)}</span></div>`:""}
${sz.length?`<div class="row">${sz.map(z=>`<button class="sz" aria-pressed="${s.s==z}" data-id="${esc(x.id)}" data-s="${esc(z)}">${esc(z)}</button>`).join("")}</div>`:""}
<button class="add" data-add="${esc(x.id)}">أضف للسلة</button></div></article>`}).join("")||'<p class="empty">لا توجد منتجات في هذا القسم حالياً.</p>'}
function render(){
 cart=cart.filter(i=>P.some(x=>x.id==i.id));
 $("cnt").textContent=cart.reduce((a,i)=>a+i.q,0);
 const tot=cart.reduce((a,i)=>a+i.q*P.find(x=>x.id==i.id).p,0);
 $("items").innerHTML=cart.length?cart.map((i,k)=>{const x=P.find(y=>y.id==i.id);return `<div class="item"><div>${esc(x.n)}<small>${[i.c,i.s].filter(Boolean).map(esc).concat(fmt(x.p)).join(" / ")}</small></div><div class="qty"><button data-q="${k}" data-d="1" aria-label="زيادة">+</button>${i.q}<button data-q="${k}" data-d="-1" aria-label="نقص">−</button></div></div>`}).join(""):`<div class="empty">السلة فارغة. اختر قطعة وأضفها.</div>`;
 const lines=cart.map(i=>{const x=P.find(y=>y.id==i.id);return `- ${x.n} ${[i.c,i.s].filter(Boolean).length?"("+[i.c,i.s].filter(Boolean).join("، ")+")":""} × ${i.q} = ${(x.p*i.q).toFixed(3)}`}).join("\n");
 const msg=`السلام عليكم، أريد أطلب من ${STORE}:\n${lines}\nالمجموع: ${tot.toFixed(3)} ${CUR}\nالاسم والعنوان:`;
 $("foot").innerHTML=cart.length?`<div class="total"><span>المجموع</span><span>${fmt(tot)}</span></div><a class="order" target="_blank" rel="noopener" href="https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}">أرسل الطلب عبر واتساب</a>`:"";
 save()}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(d.k){cat=d.k;tabs();grid()}
 else if(d.c){S(P.find(x=>x.id==d.id)).c=d.c;grid()}
 else if(d.s){S(P.find(x=>x.id==d.id)).s=d.s;grid()}
 else if(d.add){const s=S(P.find(x=>x.id==d.add)),f=cart.find(i=>i.id==d.add&&i.c==s.c&&i.s==s.s);f?f.q++:cart.push({id:d.add,c:s.c,s:s.s,q:1});render();$("drawer").classList.add("open")}
 else if(d.q){cart[d.q].q+=+d.d;if(cart[d.q].q<1)cart.splice(d.q,1);render()}
 else if(t.id=="open")$("drawer").classList.add("open");
 else if(t.id=="close")$("drawer").classList.remove("open")});
$("drawer").addEventListener("click",e=>{if(e.target.id=="drawer")$("drawer").classList.remove("open")});
$("fab").href=`https://wa.me/${PHONE}?text=${encodeURIComponent("السلام عليكم، عندي استفسار")}`;
tabs();grid();render();

</script>
</body>
</html>
